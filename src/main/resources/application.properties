gg.jte.development-mode=true
gg.jte.template-location=src/main/jte
spring.application.name=mabillon
server.error.whitelabel.enabled=false
spring.servlet.multipart.max-file-size=${MABILLON_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MABILLON_MAX_REQUEST_SIZE:55MB}
mabillon.storage.max-file-size-bytes=${MABILLON_MAX_FILE_SIZE_BYTES:52428800}
mabillon.cayenne.min-connections=${MABILLON_DB_POOL_MIN:2}
mabillon.cayenne.max-connections=${MABILLON_DB_POOL_MAX:12}
mabillon.cayenne.max-queue-wait-ms=${MABILLON_DB_POOL_WAIT_MS:5000}
mabillon.archive.sip-root=${MABILLON_SIP_ROOT:${java.io.tmpdir}/mabillon-sips}
mabillon.archive.ech-0160-xsd-root=${MABILLON_ECH_XSD_ROOT:docs/archive/profiles/ech-0160-1.3.0/xsd}
mabillon.observability.environment=${MABILLON_ENVIRONMENT:development}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=${BUILD_VERSION:0.0.1-SNAPSHOT}
info.app.environment=${mabillon.observability.environment}
logging.level.root=${MABILLON_LOG_LEVEL:INFO}
logging.level.org.apache.cayenne=WARN
logging.level.org.springframework.security=INFO
mabillon.security.admin-actor-username=${MABILLON_ADMIN_ACTOR_USERNAME:anna.mueller}
mabillon.security.sachbearbeiter-actor-username=${MABILLON_SACHBEARBEITER_ACTOR_USERNAME:a.keller}
mabillon.interlis.db-host=${PGHOST:localhost}
mabillon.interlis.db-port=${PGPORT:55432}
mabillon.interlis.db-database=${PGDATABASE:mabillon}
mabillon.interlis.db-user=${PGUSER:mabillon}
mabillon.interlis.db-password=${PGPASSWORD:mabillon}
mabillon.interlis.db-schema=mabillon
mabillon.interlis.export-root=${java.io.tmpdir}/mabillon-exports
