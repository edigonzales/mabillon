services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mabillon}
      POSTGRES_USER: ${POSTGRES_USER:-mabillon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - mabillon-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MABILLON_CAYENNE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mabillon}
      MABILLON_CAYENNE_USERNAME: ${POSTGRES_USER:-mabillon}
      MABILLON_CAYENNE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      MABILLON_SECURITY_ADMIN_PASSWORD: ${MABILLON_SECURITY_ADMIN_PASSWORD:?MABILLON_SECURITY_ADMIN_PASSWORD must be set}
    ports:
      - "8080:8080"
    volumes:
      - mabillon-documents:/opt/mabillon/data
      - mabillon-sips:/opt/mabillon/sips

volumes:
  mabillon-postgres:
  mabillon-documents:
  mabillon-sips:
