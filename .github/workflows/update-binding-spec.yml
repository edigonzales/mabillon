name: Update binding spec

on:
  push:
    branches:
      - agent/phase-11-spec-closure-matrix

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'chore: fix one-shot binding spec updater'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/phase-11-spec-closure-matrix
      - name: Align binding specification
        run: python .github/update_binding_spec.py
      - name: Commit binding specification
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/update-binding-spec.yml .github/update_binding_spec.py
          git add -A
          git commit -m 'docs: align binding spec with INTERLIS Java APIs'
          git push origin HEAD:agent/phase-11-spec-closure-matrix
