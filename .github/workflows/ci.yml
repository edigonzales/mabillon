name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  update-binding-spec:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'chore: run binding spec update v2' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/phase-11-spec-closure-matrix

      - name: Update binding specification
        run: python .github/update_binding_spec.py

      - name: Restore CI and commit
        shell: bash
        run: |
          python .github/restore_ci.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/update-binding-spec.yml .github/update_binding_spec.py .github/restore_ci.py
          git add -A
          git commit -m 'docs: align binding spec with INTERLIS Java APIs'
          git push origin HEAD:agent/phase-11-spec-closure-matrix

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
