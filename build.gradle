plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.cyclonedx.bom' version '2.2.0'
}

group = 'guru.interlis'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://jars.interlis.ch') }
}

sourceSets {
    main.java.srcDir("$projectDir/src/generated/java")
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'gg.jte:jte-spring-boot-starter-4:3.2.4'
    implementation 'org.apache.cayenne:cayenne:5.0-M2'

    // One coherent INTERLIS toolchain. ili2pg 5.5.1 and ilivalidator 1.15.0
    // both use the ili2c 5.6.8 / iox-ili 1.24.4 generation.
    implementation 'ch.interlis:ili2pg:5.5.1'
    implementation 'ch.interlis:ili2db:5.5.1'
    implementation 'ch.interlis:ilivalidator:1.15.0'
    implementation 'ch.interlis:ili2c-tool:5.6.8'
    implementation 'ch.interlis:ili2c-core:5.6.8'
    implementation 'ch.interlis:iox-ili:1.24.4'
    implementation 'ch.interlis:iox-api:1.0.4'
    implementation 'ch.ehi:ehibasics:1.4.1'
    runtimeOnly 'org.postgresql:postgresql:42.7.7'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
